plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 34
    namespace 'com.builder'

    defaultConfig {
        applicationId "com.builder"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Batasi arsitektur biner Rust agar tidak menduplikasi space APK
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true        // Menghapus kode Java/Kotlin yang tidak terpakai
            shrinkResources true      // Menghapus resource/asset yang tidak terpakai
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Mencegah pembengkakan dari sisa-sisa debug symbol
            ndk {
                debugSymbolLevel 'NONE'
            }
        }
    }

    // Bypass pengecekan ketat Lint saat merakit APK Release di CI
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.14"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    
    // Di-upgrade sedikit ke 1.8.2 agar selaras dengan library internal fragment
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.navigation:navigation-compose:2.7.6'
    
    // Catatan: material-icons-extended akan dipangkas habis oleh R8 minify di atas
    implementation 'androidx.compose.material:material-icons-extended:1.5.4'

    def camerax_version = "1.3.2"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-video:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-extensions:${camerax_version}"

    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0"

    // Library Tambahan untuk GPS / Lokasi Watermark
    implementation 'com.google.android.gms:play-services-location:21.2.0'
}
