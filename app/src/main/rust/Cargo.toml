[package]
name = "rust_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
image = { version = "0.24.7", default-features = false, features = ["jpeg", "png", "webp"] }
rayon = "1.8.0"

[profile.release]
opt-level = 'z'     # Optimasi ukuran biner terkecil
lto = true          # Link Time Optimization
codegen-units = 1
panic = 'abort'     # Potong stack trace panic
strip = true        # Hapus debug symbols otomatis
